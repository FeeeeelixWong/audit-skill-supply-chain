name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 tools/validate_skill.py
      - run: python3 skills/audit-skill-supply-chain/scripts/audit_skill.py bootstrap --help
      - run: python3 tools/create_cli_adapter.py --target all --dry-run
      - run: python3 skills/audit-skill-supply-chain/scripts/scan_installed_skills.py --path skills --fail-on critical
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Smoke-test reusable Action
        id: action-smoke
        uses: ./
        with:
          target: tests/fixtures/clean-skill
          fail-on: quarantine
      - name: Verify reusable Action outputs
        env:
          AUDIT_GATE: ${{ steps.action-smoke.outputs.gate }}
          JSON_REPORT: ${{ steps.action-smoke.outputs.json }}
          SARIF_REPORT: ${{ steps.action-smoke.outputs.sarif }}
        run: |
          test "$AUDIT_GATE" = "ALLOW"
          test -s "$JSON_REPORT"
          test -s "$SARIF_REPORT"
      - run: python3 tools/package_release.py --version 0.0.0-ci
